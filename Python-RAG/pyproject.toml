[project]
name = "fastapi-rag-server"
version = "0.1.0"
description = "A RAG chatbot API server built with FastAPI."
authors = [
    {name = "Hoon"}
]
license = {text = "MIT"}
requires-python = "3.11.2"
dependencies = [
    "fastapi (>=0.119.0,<0.120.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "langchain (>=1.0.5,<2.0.0)",
    "langchain-core (>=1.0.0,<2.0.0)",
    "langchain-openai (>=1.0.2,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)",
    "pymupdf (>=1.26.5,<2.0.0)",
    "faiss-cpu (>=1.12.0,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "jq (>=1.10.0,<2.0.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
    "torch (>=2.9.0,<3.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "numpy (>=2.3.4,<3.0.0)"
]
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
